[package]
name = "vcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
chrono = "0.4.45"
chrono-tz = "0.10.4"
config = { version = "0.15", default-features = false, features = ["toml"] }
hex = "0.4.3"
http = "1"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
instant-acme = { version = "0.8", default-features = false, features = ["aws-lc-rs", "hyper-rustls"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-pki-types = "1"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2.0.19"
toasty = { version = "0.9.0", features = ["postgresql"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
topcoat = { version = "0.4.0", features = ["tailwind", "font-fontsource"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
topcoat = { version = "0.4.0", default-features = false, features = ["tailwind"] }

[dev-dependencies]
bytes = "1"
http-body-util = "0.1"
proptest = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tempfile = "3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }

[lints.rust]
unsafe_code = "deny"
