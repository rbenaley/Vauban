[package]
name = "vcp"
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
default-run = "vcp"

[[bin]]
name = "vcp-store"
path = "src/bin/vcp_store.rs"

[features]
# Optional checkout config / Toasty root fallback when running bare
# `cargo test` without VCP_CONFIG_DIR. Do not enable from `just test` — a
# second feature-gated lib build desyncs Topcoat AssetIds vs the asset bundle.
test-support = []

[dependencies]
ambient-authority = "0.0.2"
anyhow = "1.0.104"
argon2 = "0.5.3"
base64 = "0.22"
bzip2 = "0.5"
cap-std = "4.0.2"
flate2 = "1"
chrono = "0.4.45"
chrono-tz = "0.10.4"
config = { version = "0.15", default-features = false, features = ["toml"] }
hex = "0.4.3"
http = "1"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
instant-acme = { version = "0.8", default-features = false, features = ["aws-lc-rs", "hyper-rustls"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "pool", "builder"] }
nix = { version = "0.31.3", features = ["fs", "socket", "uio", "user"] }
p256 = { version = "0.13", features = ["ecdsa"] }
unix-ancillary = "0.3.0"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
regex = "1.13.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-pki-types = "1"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "2.0.19"
toasty = { version = "0.10.0", features = ["postgresql", "migration"] }
toasty-cli = "0.10.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
topcoat = { version = "0.8.0", features = ["tailwind", "font-fontsource", "mail", "mail-smtp", "multipart"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
xz2 = "0.1"
zstd = "0.13"

# FreeBSD-only: wraps cap_enter(2). Does not compile on other targets.
[target.'cfg(target_os = "freebsd")'.dependencies]
capsicum = "0.4"

[build-dependencies]
topcoat = { version = "0.8.0", default-features = false, features = ["tailwind"] }

[dev-dependencies]
topcoat-asset = { version = "0.8.0", features = ["bundler"] }
bytes = "1"
http-body-util = "0.1"
proptest = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tempfile = "3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }

[lints.rust]
unsafe_code = "deny"
