[workspace]
resolver = "2"
members = [
    "shared",
    "vauban-db",
    "vauban-supervisor",
    "vauban-web",
    "vauban-auth",
    "vauban-access",
    "vauban-proxy-ssh",
    "vauban-proxy-iacs",
    "vauban-vault",
    "vauban-audit",
]
# vauban-proxy-rdp is excluded due to irreconcilable pre-release version
# conflicts in the RustCrypto ecosystem between ironrdp/picky/sspi (sha1
# =0.11.0-rc.2, digest =0.11.0-rc.5, crypto-common =0.2.0-rc.8) and
# russh/ssh-key (sha1 ^0.11.0-rc.3). Use `just build` to compile everything.
exclude = ["vauban-proxy-rdp"]

# Default package for `cargo run` from workspace root
# vauban-supervisor is the main entry point that orchestrates all services
default-members = ["vauban-supervisor"]

[workspace.package]
version = "0.9.7"
edition = "2024"
rust-version = "1.89"
authors = ["Richard Ben Aleya"]
license = "BSD-2-Clause"

[workspace.dependencies]
# Shared dependencies (minimalist, no async runtime)
shared = { path = "shared" }
vauban-db = { path = "vauban-db" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"
libc = "0.2"

# POSIX wrappers (safe alternatives to libc)
nix = { version = "0.31", features = ["process", "signal", "poll", "fs", "user", "socket", "uio", "term"] }

# Configuration loading
config = { version = "0.15", default-features = false, features = ["toml"] }

# Async runtime - used by vauban-web and proxy services (vauban-proxy-ssh, vauban-proxy-rdp)
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }

# SSH client (async, pure Rust) - used by vauban-proxy-ssh
# Note: russh 0.57+ includes keys module directly (no separate russh-keys crate)
# 0.61 migrates from the internal ssh-key 0.6 fork to upstream ssh-key 0.7
# and replaces libcrux-ml-kem with the RustCrypto ml-kem crate (drops
# libcrux-sha3, RUSTSEC-2026-0074).
russh = "0.61"
async-trait = "0.1"

# OS CSPRNG adapter for `ssh_key::PrivateKey::random` (Ed25519 host-key
# generation). russh 0.61's upstream ssh-key 0.7 requires a `rand_core`
# 0.10 `CryptoRng`; rand_core 0.10 no longer ships `OsRng`. getrandom's
# `SysRng` is the OS entropy source (it is `TryCryptoRng`; wrap it in
# `rand_core::UnwrapErr` to satisfy the infallible `CryptoRng` bound).
# This is the same getrandom already pulled transitively by russh/rand,
# so it adds no new crate to the graph.
getrandom = { version = "0.4", features = ["sys_rng"] }


# Secret management and memory zeroization
secrecy = { version = "0.10", features = ["serde"] }
zeroize = { version = "1.8", features = ["derive"] }

# Integrity hashing
blake3 = "1.5"

# RBAC policy engine (Casbin) - used by vauban-access
casbin = { version = "2.20", default-features = false, features = ["runtime-tokio"] }

# Cryptography for vauban-vault
aes-gcm = "0.10"
hkdf = "0.12"
sha3 = "0.10"
base64 = "0.22"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }

# Centralized clippy security lints (deny instead of warn)
[workspace.lints.clippy]
unwrap_used    = "deny"
expect_used    = "deny"
panic          = "deny"
todo           = "deny"
dbg_macro      = "deny"
unimplemented  = "deny"
print_stdout   = "deny"
print_stderr   = "deny"

[profile.release]
opt-level = 3
lto = true
debug = false
strip = true

[profile.release.package."*"]
opt-level = 3
