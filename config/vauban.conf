# VAUBAN - Production configuration (self-contained)
#
# This file contains all configuration values needed for production.
# No default.toml is required.

bin_path = "/usr/local/libexec/vauban"
# secret_key is injected by +POST_INSTALL during package installation.
# For manual setup, replace with a random 32+ character string.
secret_key = "CHANGE-ME-IN-PRODUCTION-32-CHARS!"

# ==============================================================================
# SUPERVISOR
# ==============================================================================

# The supervisor stays root to respawn children with dedicated UIDs.
[supervisor]
heartbeat_interval_secs = 5
heartbeat_timeout_secs = 2
max_missed_heartbeats = 3
max_respawns_per_hour = 10
drain_timeout_secs = 30

# Service configurations with dedicated UID/GID for each service.
# Accounts are created automatically by the vauban package (+PRE_INSTALL).

[services.audit]
name = "vauban-audit"
binary = "vauban-audit"
uid = 901
gid = 901

[services.vault]
name = "vauban-vault"
binary = "vauban-vault"
uid = 902
gid = 902

[services.rbac]
name = "vauban-rbac"
binary = "vauban-rbac"
uid = 903
gid = 903

# ==============================================================================
# RBAC (Casbin)
# ==============================================================================

[rbac]
model_path = "/usr/local/etc/vauban/rbac/model.conf"
policy_path = "/usr/local/etc/vauban/rbac/policy.csv"

[services.auth]
name = "vauban-auth"
binary = "vauban-auth"
uid = 904
gid = 904

[services.proxy_ssh]
name = "vauban-proxy-ssh"
binary = "vauban-proxy-ssh"
uid = 905
gid = 905

[services.proxy_rdp]
name = "vauban-proxy-rdp"
binary = "vauban-proxy-rdp"
uid = 906
gid = 906

[services.web]
name = "vauban-web"
binary = "vauban-web"
uid = 907
gid = 907

# ==============================================================================
# WEB / API
# ==============================================================================

[server]
host = "0.0.0.0"
port = 443

[server.tls]
cert_path = "/usr/local/etc/vauban/certs/server.crt"
key_path = "/usr/local/etc/vauban/certs/server.key"
# ca_chain_path = "/usr/local/etc/vauban/certs/ca-chain.crt"

# ACME automatic certificate renewal (TLS-ALPN-01, port 443).
[server.tls.acme]
enabled = false
email = "admin@example.com"                             # CHANGE ME
domains = ["vauban.example.com"]                        # CHANGE ME
renew_before_hours = 24
account_key_path = "/usr/local/etc/vauban/acme/account.pem"
staging = false
directory_url = "https://acme-v02.api.letsencrypt.org/directory"
staging_directory_url = "https://acme-staging-v02.api.letsencrypt.org/directory"
# For ZeroSSL instead of Let's Encrypt:
# directory_url = "https://acme.zerossl.com/v2/DV90"
# staging_directory_url = ""
# eab_kid = "your_kid_here"
# eab_hmac_key = "your_hmac_key_here"

[database]
# url is injected by +POST_INSTALL during package installation.
# For manual setup: url = "postgresql://vauban:<password>@localhost/vauban"
url = "postgresql://vauban:vauban@localhost/vauban"
max_connections = 20
min_connections = 5
connect_timeout_secs = 5

[cache]
enabled = false
url = "redis://localhost:6379"
default_ttl_secs = 7200

[jwt]
access_token_lifetime_minutes = 15
refresh_token_lifetime_days = 1
algorithm = "HS256"

[security]
password_min_length = 14
max_failed_login_attempts = 3
session_max_duration_secs = 14400   # 4 hours
session_idle_timeout_secs = 900     # 15 minutes
rate_limit_per_minute = 60
trusted_proxies = ["127.0.0.1", "::1"]

[security.argon2]
memory_size_kb = 65536
iterations = 3
parallelism = 1

[logging]
level = "info"
format = "text"

[api]
enabled = false
prefix = "/api/v1"

[websocket]
max_connections_per_user = 30

# ==============================================================================
# RDP
# ==============================================================================

[rdp]
video_bitrate_bps = 5_000_000

# ==============================================================================
# SESSION RECORDING
# ==============================================================================

[recording]
storage_path = "/var/vauban/recordings"
rdp = true
ssh = true
