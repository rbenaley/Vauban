# VAUBAN - Production configuration (self-contained)
#
# This file contains all configuration values needed for production.
# No default.toml is required.

bin_path = "/usr/local/libexec/vauban"
# secret_key is injected by +POST_INSTALL during package installation.
# For manual setup, replace with a random 32+ character string.
secret_key = "CHANGE-ME-IN-PRODUCTION-32-CHARS!"

[product.brand]
name = "VAUBAN"

# ==============================================================================
# SUPERVISOR
# ==============================================================================

# The supervisor stays root to respawn children with dedicated UIDs.
[supervisor]
heartbeat_interval_secs = 5
heartbeat_timeout_secs = 2
max_missed_heartbeats = 3
max_respawns_per_hour = 10
drain_timeout_secs = 30

# Service configurations with dedicated UID/GID for each service.
# Accounts are created automatically by the vauban package (+PRE_INSTALL).

[services.audit]
name = "vauban-audit"
binary = "vauban-audit"
uid = 901
gid = 901

[services.vault]
name = "vauban-vault"
binary = "vauban-vault"
uid = 902
gid = 902

[services.access]
name = "vauban-access"
binary = "vauban-access"
uid = 903
gid = 903

# ==============================================================================
# ACCESS (Casbin)
# ==============================================================================

[access]
model_path = "/usr/local/etc/vauban/access/model.conf"
policy_path = "/usr/local/etc/vauban/access/policy.csv"

[services.auth]
name = "vauban-auth"
binary = "vauban-auth"
uid = 904
gid = 904

[services.proxy_ssh]
name = "vauban-proxy-ssh"
binary = "vauban-proxy-ssh"
uid = 905
gid = 905

[services.proxy_rdp]
name = "vauban-proxy-rdp"
binary = "vauban-proxy-rdp"
uid = 906
gid = 906

[services.web]
name = "vauban-web"
binary = "vauban-web"
uid = 907
gid = 907

[services.proxy_iacs]
name = "vauban-proxy-iacs"
binary = "vauban-proxy-iacs"
uid = 908
gid = 908

# ==============================================================================
# WEB / API
# ==============================================================================

[server]
host = "0.0.0.0"
port = 443

[server.tls]
cert_path = "/usr/local/etc/vauban/certs/server.crt"
key_path = "/usr/local/etc/vauban/certs/server.key"
# ca_chain_path = "/usr/local/etc/vauban/certs/ca-chain.crt"

# ACME automatic certificate renewal (TLS-ALPN-01, port 443).
[server.tls.acme]
enabled = false
email = "admin@example.com"                             # CHANGE ME
domains = ["vauban.example.com"]                        # CHANGE ME
renew_before_hours = 24
account_key_path = "/usr/local/etc/vauban/acme/account.pem"
staging = false
directory_url = "https://acme-v02.api.letsencrypt.org/directory"
staging_directory_url = "https://acme-staging-v02.api.letsencrypt.org/directory"
# For ZeroSSL instead of Let's Encrypt:
# directory_url = "https://acme.zerossl.com/v2/DV90"
# staging_directory_url = ""
# eab_kid = "your_kid_here"
# eab_hmac_key = "your_hmac_key_here"

[database]
# url is injected by +POST_INSTALL during package installation.
# For manual setup: url = "postgresql://vauban:<password>@localhost/vauban"
url = "postgresql://vauban:CHANGE-ME@localhost/vauban"
max_connections = 20
min_connections = 5
connect_timeout_secs = 5

[cache]
enabled = false
url = "redis://localhost:6379"
default_ttl_secs = 7200

[jwt]
access_token_lifetime_minutes = 15
refresh_token_lifetime_days = 1
algorithm = "HS256"

[security]
password_min_length = 14
max_failed_login_attempts = 3
session_max_duration_secs = 14400   # 4 hours
session_idle_timeout_secs = 900     # 15 minutes
rate_limit_per_minute = 60
trusted_proxies = ["127.0.0.1", "::1"]
# Require users to provide a justification before connecting to an asset.
# When true, a modal prompts for a reason that is stored in the session record.
# Set to false to allow direct connections without justification.
require_justification = true

[security.argon2]
memory_size_kb = 65536
iterations = 3
parallelism = 1

[logging]
level = "info"
format = "text"

[api]
enabled = false
prefix = "/api/v1"

[websocket]
max_connections_per_user = 30

# ==============================================================================
# EMAIL NOTIFICATIONS (Issue #10)
# ==============================================================================
#
# In production, set VAUBAN_SMTP_PASSWORD (and optionally VAUBAN_SMTP_USERNAME)
# in the unit/service environment file rather than this TOML. Both env vars
# are erased from /proc/PID/environ right after read.

[mailer]
enabled = false                          # CHANGE ME after configuring SMTP
from_address = "vauban@example.com"      # CHANGE ME
from_name = "Vauban PAM"
reply_to = ""
base_url = "https://vauban.example.com"  # CHANGE ME (must be https:// in prod)
smtp_host = "smtp.example.com"           # CHANGE ME
smtp_port = 587
smtp_encryption = "starttls"             # plaintext is rejected in production
smtp_username = ""                       # override via VAUBAN_SMTP_USERNAME
smtp_password = ""                       # override via VAUBAN_SMTP_PASSWORD
helo_name = ""                           # falls back to "vauban" if empty
poll_interval_secs = 10
batch_size = 16
max_attempts = 5
smtp_timeout_secs = 30
broker_timeout_secs = 30

# ==============================================================================
# RDP
# ==============================================================================

[rdp]
video_bitrate_bps = 5_000_000

# ==============================================================================
# SESSION RECORDING
# ==============================================================================

[recording]
enabled = true
storage_path = "/var/vauban/recordings"
recording_daily_cron_timezone = "Europe/Brussels"

# Per-protocol switches; require enabled = true to take effect.
rdp = true
ssh = true
iacs = true

# Hydrator
hydration_daily_cron_hour = 4
hydration_enqueue_delay_secs = 5
hydration_missing_meta_grace_secs = 300

# Retention reaper
retention_daily_cron_hour = 5
retention_enabled = true
retention_days = 365
retention_max_size_gib = 0       # 0 = unlimited
retention_batch_size = 50

# ==============================================================================
# IACS / INDUSTRIAL
# ==============================================================================

[industrial]
# Single master switch for the entire industrial surface (UI, sshd
# tunnel, audit, future protocols). Default `true`. When `false`,
# the supervisor does NOT spawn vauban-proxy-iacs, does NOT pre-bind
# the IACS sshd listener, and the web UI hides every /iacs/* route.
enabled = true
max_ews_per_user = 0      # 0 = no cap; otherwise a per-user EWS quota

# Anti-SSRF: `allow_loopback_targets = false` (default) refuses to
# broker upstream TCP connect to a loopback IP. Flip to `true` only
# in dev/E2E where the fake industrial server runs on `127.0.0.1`.
[industrial.iacs_tunnel]
# `enabled` here is DEPRECATED (May 2026) -- use `industrial.enabled`
# above. The supervisor logs a warning at boot if this key is still
# present and ignores it.
bind_addr = "0.0.0.0:22322"
advertise_hostname = "localhost"
host_key_path = "/var/lib/vauban/iacs_tunnel_host_ed25519"
max_concurrent_per_user = 4
max_concurrent_per_ews = 2
# Per-login concurrent SSH `direct-tcpip` channels. Each TCP
# `accept()` on the EWS-side `ssh -L LP:asset:AP` listener spawns a
# new channel by OpenSSH design; capping the count protects against
# fan-out exfil while preserving the multi-client workflow (e.g.
# HMI + Modbus diagnostic tool against the same asset). `0`
# disables the cap; default `16` leaves headroom for legitimate
# bursts. NEVER set to `1` -- that re-introduces the pre-v0.7.9
# bug where `nc`/Ctrl-C/`nc` returns `administratively prohibited`.
max_concurrent_channels_per_session = 16
waiting_client_ttl_seconds = 300
revocation_poll_interval_seconds = 2
allow_loopback_targets = false
