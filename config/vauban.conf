# VAUBAN - Production configuration (self-contained)
#
# This file contains all configuration values needed for production.
# No default.toml is required.

bin_path = "/usr/local/libexec/vauban"
# secret_key is injected by +POST_INSTALL during package installation.
# For manual setup, replace with a random 32+ character string.
secret_key = "CHANGE-ME-IN-PRODUCTION-32-CHARS!"

[product.brand]
name = "VAUBAN"

# ==============================================================================
# SUPERVISOR
# ==============================================================================

# The supervisor stays root to respawn children with dedicated UIDs.
[supervisor]
heartbeat_interval_secs = 5
heartbeat_timeout_secs = 2
max_missed_heartbeats = 3
max_respawns_per_hour = 10
drain_timeout_secs = 30

# Service configurations with dedicated UID/GID for each service.
# Accounts are created automatically by the vauban package (+PRE_INSTALL).

[services.audit]
name = "vauban-audit"
binary = "vauban-audit"
uid = 901
gid = 901

[services.vault]
name = "vauban-vault"
binary = "vauban-vault"
uid = 902
gid = 902

[services.access]
name = "vauban-access"
binary = "vauban-access"
uid = 903
gid = 903

# ==============================================================================
# ACCESS (Casbin)
# ==============================================================================

[access]
model_path = "/usr/local/etc/vauban/access/model.conf"
policy_path = "/usr/local/etc/vauban/access/policy.csv"

[services.auth]
name = "vauban-auth"
binary = "vauban-auth"
uid = 904
gid = 904

[services.proxy_ssh]
name = "vauban-proxy-ssh"
binary = "vauban-proxy-ssh"
uid = 905
gid = 905

[services.proxy_rdp]
name = "vauban-proxy-rdp"
binary = "vauban-proxy-rdp"
uid = 906
gid = 906

[services.web]
name = "vauban-web"
binary = "vauban-web"
uid = 907
gid = 907

[services.proxy_iacs]
name = "vauban-proxy-iacs"
binary = "vauban-proxy-iacs"
uid = 908
gid = 908

[services.mailer]
name = "vauban-mailer"
binary = "vauban-mailer"
uid = 909
gid = 909

# ==============================================================================
# WEB / API
# ==============================================================================

[server]
host = "0.0.0.0"
port = 443

# CORS allowlist. Cross-origin browser requests are accepted only when their
# `Origin` header EXACTLY matches one of these origins; the decision is NEVER
# derived from the client-controlled `Host` header. Format: `https://host[:port]`
# (no trailing slash). REQUIRED in production (startup fails if empty or
# non-https). Replace with the bastion's real public origin(s).
public_origins = ["https://bastion.example.com"]

[server.tls]
cert_path = "/usr/local/etc/vauban/certs/server.crt"
key_path = "/usr/local/etc/vauban/certs/server.key"
# ca_chain_path = "/usr/local/etc/vauban/certs/ca-chain.crt"

# ACME automatic certificate renewal (TLS-ALPN-01, port 443).
[server.tls.acme]
enabled = false
email = "admin@example.com"                             # CHANGE ME
domains = ["vauban.example.com"]                        # CHANGE ME
renew_before_hours = 24
account_key_path = "/usr/local/etc/vauban/acme/account.pem"
staging = false
directory_url = "https://acme-v02.api.letsencrypt.org/directory"
staging_directory_url = "https://acme-staging-v02.api.letsencrypt.org/directory"
# For ZeroSSL instead of Let's Encrypt:
# directory_url = "https://acme.zerossl.com/v2/DV90"
# staging_directory_url = ""
# eab_kid = "your_kid_here"
# eab_hmac_key = "your_hmac_key_here"

[database]
# url is injected by +POST_INSTALL during package installation.
# For manual setup: url = "postgresql://vauban:<password>@localhost/vauban"
url = "postgresql://vauban:CHANGE-ME@localhost/vauban"
max_connections = 20
min_connections = 5
connect_timeout_secs = 5

[cache]
# In-process no-op cache (no external cache server).
enabled = false
default_ttl_secs = 7200

[jwt]
access_token_lifetime_minutes = 15
refresh_token_lifetime_days = 1
algorithm = "HS256"

[security]
password_min_length = 14
max_failed_login_attempts = 3
session_max_duration_secs = 14400   # 4 hours
session_idle_timeout_secs = 900     # 15 minutes
rate_limit_per_minute = 60
session_create_rate_per_minute = 12
session_create_rate_global_per_minute = 120
max_concurrent_sessions_per_user = 10
max_concurrent_sessions_per_asset = 20
trusted_proxies = ["127.0.0.1", "::1"]
# Global client IP ACL (CIDR allowlist). Empty list = disabled (allow all).
# When set, ANY client whose IP is outside every range can never connect to
# the bastion: HTTP/WS (vauban-web) sees it as an anonymous visitor forever
# (stealth deny -- no dedicated error, login always fails generically), and
# the IACS SSH listener drops the TCP connection before any SSH banner.
# Examples:
#   allowed_client_networks = ["10.0.0.0/8", "10.20.0.0/28", "104.28.30.3/32"]
# Use /32 (or a bare IP) to allow a provider reaching Vauban from a single
# specific address. Notes:
# - Loopback (127.0.0.0/8, ::1) is ALWAYS permitted (anti-lockout rescue).
# - ACME certificate renewal (TLS-ALPN-01) is NOT subject to this ACL: the
#   challenge is answered below the HTTP layer, so any CA IP can validate.
# - An invalid CIDR entry stops the service at boot (fail-closed).
allowed_client_networks = []
# Require users to provide a justification before connecting to an asset.
# When true, a modal prompts for a reason that is stored in the session record.
# Set to false to allow direct connections without justification.
require_justification = true

[security.argon2]
memory_size_kb = 65536
iterations = 3
parallelism = 1

# ==============================================================================
# DIRECTORY AUTHENTICATION (LDAPS / Active Directory)
# ==============================================================================
#
# When enabled, users can authenticate against an LDAPS/AD directory. The
# supervisor only brokers the TCP socket to the directory (DNS + connect(),
# gated by the (host, port) derived from `url`, exactly like the [mailer]
# SSRF guard) and ships the trust anchor pre-seal; vauban-auth (sandboxed)
# terminates TLS and performs the LDAP simple bind. The plaintext password
# NEVER transits the supervisor.
#
# SECURITY: only `ldaps://` is accepted -- a plaintext `ldap://` url is
# rejected at config load. Disabled by default.

[auth.ldaps]
enabled = false
# ldaps://host[:port] of the directory (default LDAPS port is 636).
url = ""
# DN / UPN template; `{username}` is substituted at bind time, e.g.
# "{username}@example.com" (AD UPN) or
# "uid={username},ou=users,dc=example,dc=com" (LDAP DN).
dn_template = ""
# PEM CA bundle validating the directory's TLS certificate. Read by the
# supervisor (root) under certs/ and forwarded pre-seal to vauban-auth.
ca_cert_file = "/usr/local/etc/vauban/certs/ldap_ca.pem"
# Per-attempt timeout budget in seconds (broker + TLS handshake + bind).
timeout_secs = 5
# Auth-source precedence for UNKNOWN usernames (JIT). Existing users are
# always routed by their own stored `auth_source`, never by this list.
order = ["ldap", "local"]
# Login-form credential length floors applied BEFORE any LDAPS bind.
# These do NOT enforce directory password policy (AD / Authentik still
# owns that). Independent of security.password_min_length (local create /
# change only). Absolute floors: username >= 3, password >= 12 -- boot
# refuses to start if either value is lower. Raise them to skip useless
# binds earlier when typed credentials are obviously too short.
login_username_min_length = 3
login_password_min_length = 12

[auth.kerberos]
# Kerberos KDC brokering for RDP assets in "kerberos_restricted_admin" mode.
# When enabled, the supervisor relays the sandboxed RDP proxy's KDC exchanges
# (AS-REQ / TGS-REQ) to the KDC below over TCP 88. The supervisor connects ONLY
# to this endpoint (SSRF-safe); the relay carries no attacker-chosen host.
enabled = false
# Kerberos realm, uppercase (e.g. "EXAMPLE.COM").
realm = ""
# KDC hostname or IP (the domain controller).
kdc_host = ""
# KDC TCP port (Kerberos default 88).
kdc_port = 88
# Per-exchange timeout budget in seconds (broker TCP connect + I/O).
timeout_secs = 5

[logging]
level = "info"
format = "text"

[api]
enabled = false
prefix = "/api/v1"

[websocket]
max_connections_per_user = 30

# ==============================================================================
# EMAIL NOTIFICATIONS (Issue #10)
# ==============================================================================
#
# In production, set VAUBAN_SMTP_PASSWORD (and optionally VAUBAN_SMTP_USERNAME)
# in the unit/service environment file rather than this TOML. Both env vars
# are erased from /proc/PID/environ right after read.

[mailer]
enabled = false                          # CHANGE ME after configuring SMTP
from_address = "vauban@example.com"      # CHANGE ME
from_name = "Vauban PAM"
reply_to = ""
base_url = "https://vauban.example.com"  # CHANGE ME (must be https:// in prod)
smtp_host = "smtp.example.com"           # CHANGE ME
smtp_port = 587
smtp_encryption = "starttls"             # plaintext is rejected in production
smtp_username = ""                       # override via VAUBAN_SMTP_USERNAME
smtp_password = ""                       # override via VAUBAN_SMTP_PASSWORD
smtp_accept_invalid_certs = false        # true: self-signed / private-CA SMTP (allowed in prod)
helo_name = ""                           # falls back to "vauban" if empty
poll_interval_secs = 10
batch_size = 16
max_attempts = 5
smtp_timeout_secs = 30
broker_timeout_secs = 30

# ==============================================================================
# RDP
# ==============================================================================

[rdp]
video_bitrate_bps = 5_000_000

# ==============================================================================
# SESSION RECORDING
# ==============================================================================

[recording]
enabled = true
storage_path = "/var/vauban/recordings"
recording_daily_cron_timezone = "Europe/Brussels"

# Per-protocol switches; require enabled = true to take effect.
rdp = true
ssh = true
iacs = true

# Hydrator
hydration_daily_cron_hour = 4
hydration_enqueue_delay_secs = 5
hydration_missing_meta_grace_secs = 300

# Retention reaper
retention_daily_cron_hour = 5
retention_enabled = true
retention_days = 365
retention_max_size_gib = 0       # 0 = unlimited
retention_batch_size = 50

# ==============================================================================
# TAMPER-EVIDENT AUDIT LOG (WORM)
# ==============================================================================
#
# Separate tree from [recording]: the WORM log is append-only and never deleted
# by the retention reaper. Give it dedicated ownership (audit uid 901) and, if
# possible, an append-only / WORM mount. The +PRE_INSTALL script creates the
# directory; the sealed signing key is provisioned out of band with
# `vauban-vault seal-audit-key`.

[audit]
log_path = "/var/vauban/audit"
# Sealed Ed25519 signing key. Defaults to "<log_path>/signing_key.sealed".
# signing_key_path = "/var/vauban/audit/signing_key.sealed"

# ==============================================================================
# IACS / INDUSTRIAL
# ==============================================================================

[industrial]
# Single master switch for the entire industrial surface (UI, sshd
# tunnel, audit, future protocols). Default `false` in default.toml.
# When `false`, the supervisor does NOT spawn vauban-proxy-iacs, does NOT
# pre-bind the IACS sshd listener, and the web UI hides every /iacs/* route.
enabled = true
max_ews_per_user = 0      # 0 = no cap; otherwise a per-user EWS quota

# Anti-SSRF: `allow_loopback_targets = false` (default) refuses to
# broker upstream TCP connect to a loopback IP. Flip to `true` only
# in dev/E2E where the fake industrial server runs on `127.0.0.1`.
[industrial.iacs_tunnel]
# `enabled` here is DEPRECATED (May 2026) -- use `industrial.enabled`
# above. The supervisor logs a warning at boot if this key is still
# present and ignores it.
bind_addr = "0.0.0.0:22322"
advertise_hostname = "localhost"
host_key_path = "/var/lib/vauban/iacs_tunnel_host_ed25519"
max_concurrent_per_user = 4
max_concurrent_per_ews = 2
# Per-login concurrent SSH `direct-tcpip` channels. Each TCP
# `accept()` on the EWS-side `ssh -L LP:asset:AP` listener spawns a
# new channel by OpenSSH design; capping the count protects against
# fan-out exfil while preserving the multi-client workflow (e.g.
# HMI + Modbus diagnostic tool against the same asset). `0`
# disables the cap; default `16` leaves headroom for legitimate
# bursts. NEVER set to `1` -- that re-introduces the pre-v0.7.9
# bug where `nc`/Ctrl-C/`nc` returns `administratively prohibited`.
max_concurrent_channels_per_session = 16
waiting_client_ttl_seconds = 300
revocation_poll_interval_seconds = 2
allow_loopback_targets = false
