# VCP - Production configuration (self-contained)
#
# Deploy as /usr/local/etc/vcp/vcp.conf (or point VCP_CONFIG_DIR at a directory
# that contains this file). No default.toml merge in production.
# HTTPS only — TLS 1.3 via rustls; ACME TLS-ALPN-01 (no HTTP listener).

environment = "production"

[server]
host = "0.0.0.0"
port = 443
public_origins = ["https://access.vauban.sh"]
access_log_path = "/var/log/vcp-access.log"

[server.tls]
cert_path = "/usr/local/etc/vcp/certs/server.crt"
key_path = "/usr/local/etc/vcp/certs/server.key"
# ca_chain_path = "/usr/local/etc/vcp/certs/chain.crt"

[server.tls.acme]
enabled = false 
email = "ops@example.com"
domains = ["portal.example.com"]
renew_before_hours = 24
account_key_path = "/usr/local/etc/vcp/certs/acme-account.json"
staging = false
directory_url = "https://acme-v02.api.letsencrypt.org/directory"
staging_directory_url = "https://acme-staging-v02.api.letsencrypt.org/directory"

[database]
# Replace credentials before go-live.
url = "postgresql://vcp:CHANGE-ME@localhost/vcp"

# Client side of the storage rendezvous only. Helper owns blob_path / quotas
# in vcp-store.conf (separate process / jail).
# Production UIDs: vcp=800, vcp-storage=801 (see vcp-store.conf).
[storage]
ipc = "socket"
socket_path = "/var/run/vcp/store.sock"

# Scaleway Transactional Email (TEM) — SMTP submission.
# Username = Scaleway Project ID; password = IAM secret key with TEM permission.
# From address must use a TEM-verified domain. Keep smtp_password out of git.
[mail]
smtp_host = "smtp.tem.scaleway.com"
smtp_port = 587
smtp_encryption = "starttls"          # starttls@587 or tls@465 (also 2465)
smtp_username = "CHANGE-ME-PROJECT-ID"
smtp_password = "CHANGE-ME"

[magiclinks]
from_address = "no-reply@vauban.sh"
from_name = "Vauban Customer Portal"
reply_to = ""
vcp_admin = "support@vauban.sh"
token_ttl_secs = 300
token_retention_days = 1
purge_interval_minutes = 60

[access]
model_path = "/usr/local/etc/vcp/access/model.conf"
policy_path = "/usr/local/etc/vcp/access/default_policy.csv"

[login]
max_attempts = 10
window_secs = 300
lockout_secs = 900

[org]
max_accounts_per_org = 5
max_lts_subscriptions = 99
