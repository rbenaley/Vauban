# VCP - Default configuration
# Shared base for non-production environments.
# Override with development.toml / testing.toml and optional local.toml.

environment = "development"

[server]
host = "127.0.0.1"
port = 3000
public_origins = ["https://127.0.0.1:3000", "https://localhost:3000"]
# Apache CLF access log (relative paths resolve against the crate root).
access_log_path = "logs/vcp-access.log"

[server.tls]
cert_path = "certs/dev-server.crt"
key_path = "certs/dev-server.key"

[server.tls.acme]
enabled = false
email = ""
domains = []
renew_before_hours = 24
account_key_path = "certs/acme-account.json"
staging = true
directory_url = "https://acme-v02.api.letsencrypt.org/directory"
staging_directory_url = "https://acme-staging-v02.api.letsencrypt.org/directory"

[database]
url = "postgresql://localhost/vcp"

# Dev/test only: portal owns spawn/inline + blob root. Production splits
# client settings into vcp.conf and helper settings into vcp-store.conf.
[storage]
blob_path = "vcp-storage"
ipc = "spawn"
max_artifact_bytes = 2147483648
max_image_bytes = 10485760
allowed_image_types = ["png", "jpeg", "webp"]
max_concurrent_uploads = 4
max_images_per_org = 1000
upload_ttl_secs = 3600

# Local catch-all (Mailpit / equivalent). Production uses Scaleway TEM in vcp.conf.
[mail]
smtp_host = "localhost"
smtp_port = 1025
smtp_encryption = "plaintext"
smtp_username = ""
smtp_password = ""

[magiclinks]
from_address = "no-reply@vauban.sh"
from_name = "Vauban Customer Portal"
reply_to = ""
vcp_admin = "support@vauban.sh"
token_ttl_secs = 300
token_retention_days = 1
purge_interval_minutes = 60

[access]
model_path = "config/access/model.conf"
policy_path = "config/access/default_policy.csv"

[login]
max_attempts = 10
window_secs = 300
lockout_secs = 900

[org]
max_accounts_per_org = 5
max_lts_subscriptions = 99
