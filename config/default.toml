# VAUBAN - Default configuration
# This file contains the default values for all environments.
# Environment-specific files (development.toml, production.toml, etc.)
# can override these values.
#
# Configuration is shared by all VAUBAN components:
# - vauban-supervisor: Service orchestrator
# - vauban-web: Web interface and API

# ==============================================================================
# SUPERVISOR CONFIGURATION
# ==============================================================================

# Environment: "development" or "production"
environment = "development"
# Path to service binaries (relative to workspace root or absolute)
bin_path = "./target/debug"

[supervisor]
privsep = false
heartbeat_interval_secs = 5
heartbeat_timeout_secs = 2
max_missed_heartbeats = 3
max_respawns_per_hour = 10
drain_timeout_secs = 30

# Service configurations

[services.audit]
name = "vauban-audit"
binary = "vauban-audit"

[services.vault]
name = "vauban-vault"
binary = "vauban-vault"

[services.access]
name = "vauban-access"
binary = "vauban-access"

# ==============================================================================
# ACCESS CONFIGURATION (vauban-access / Casbin)
# ==============================================================================

[access]
model_path = "config/access/model.conf"
policy_path = "config/access/default_policy.csv"

[services.auth]
name = "vauban-auth"
binary = "vauban-auth"

[services.proxy_ssh]
name = "vauban-proxy-ssh"
binary = "vauban-proxy-ssh"

[services.proxy_rdp]
name = "vauban-proxy-rdp"
binary = "vauban-proxy-rdp"

# IACS tunnel proxy: hosts the russh sshd that EWS hosts connect to with
# `ssh -L`, brokers upstream TCP to industrial assets via the supervisor.
# Lives in its own UID (908) so the russh process is privsep-isolated
# from vauban-web. Spawned only when `[industrial].enabled = true`
# (default `false` in default.toml; override in environment-specific TOML).
[services.proxy_iacs]
name = "vauban-proxy-iacs"
binary = "vauban-proxy-iacs"

[services.web]
name = "vauban-web"
binary = "vauban-web"

# Sealed SMTP outbox drainer. Production assigns uid/gid 909 (vb-mailer)
# in vauban.conf; development leaves uid unset (privsep off).
[services.mailer]
name = "vauban-mailer"
binary = "vauban-mailer"

# ==============================================================================
# WEB CONFIGURATION (vauban-web)
# ==============================================================================

[server]
host = "0.0.0.0"
port = 8443
# workers = 4  # Optional, left to Tokio by default

# CORS allowlist. Cross-origin browser requests are accepted only when their
# `Origin` header EXACTLY matches one of these origins. This is the single
# source of truth for the CORS decision; it is NEVER derived from the
# client-controlled `Host` header. Format: `https://host[:port]` (no trailing
# slash). In production this MUST be set to the bastion's real public
# origin(s) (startup fails otherwise).
public_origins = ["https://localhost:8443"]

# TLS configuration (required - HTTPS only, TLS 1.3)
# Development: certificates are in vauban-web/certs/ (relative to workspace root)
# Production: certificates are in /usr/local/etc/vauban/certs/
[server.tls]
cert_path = "vauban-web/certs/server.crt"
key_path = "vauban-web/certs/server.key"
# ca_chain_path = "vauban-web/certs/ca-chain.crt"  # Optional, for intermediate certificates

# ACME automatic certificate management (Let's Encrypt / ZeroSSL)
# Uses TLS-ALPN-01 challenge on port 443 (no HTTP port 80 needed).
# Disabled by default - enable in production.toml for automatic renewal.
[server.tls.acme]
enabled = false
email = ""
domains = []
renew_before_hours = 24             # Renew N hours before expiration
account_key_path = "acme/account.pem"
staging = false                     # Use staging environment (testing)
directory_url = "https://acme-v02.api.letsencrypt.org/directory"
staging_directory_url = "https://acme-staging-v02.api.letsencrypt.org/directory"
# ZeroSSL ACME URLs (requires EAB credentials from dashboard):
# directory_url = "https://acme.zerossl.com/v2/DV90"
# staging_directory_url = ""        # ZeroSSL has no staging environment
# eab_kid = ""                      # External Account Binding (e.g. ZeroSSL)
# eab_hmac_key = ""                 # EAB HMAC key

[database]
url = "postgresql://vauban:vauban@localhost/vauban"
max_connections = 10
min_connections = 2
connect_timeout_secs = 10

[cache]
# In-process no-op cache (no external cache server).
enabled = false
default_ttl_secs = 3600

[jwt]
access_token_lifetime_minutes = 15
refresh_token_lifetime_days = 1
algorithm = "HS256"

[security]
password_min_length = 12
max_failed_login_attempts = 5
session_max_duration_secs = 28800   # 8 hours
# Inactivity window. The EFFECTIVE idle-logout delay is
# min(session_idle_timeout_secs, jwt.access_token_lifetime_minutes * 60):
# an idle browser stops renewing its access cookie, so past the token
# lifetime every HTTP request bounces to /login, and the WebSocket
# liveness probe (SSH/RDP/notifications) is clamped to the same horizon.
session_idle_timeout_secs = 1800    # 30 minutes (effective: 15 min, see above)
rate_limit_per_minute = 10
session_create_rate_per_minute = 12
session_create_rate_global_per_minute = 120
max_concurrent_sessions_per_user = 10
max_concurrent_sessions_per_asset = 20
# Trusted reverse proxy IPs. X-Forwarded-For / X-Real-IP headers are only
# honoured when the TCP connection originates from one of these addresses.
# Empty list = proxy headers are never trusted (safe default).
trusted_proxies = []
# Global client IP ACL (CIDR allowlist). Empty list = disabled (allow all).
# See config/vauban.conf for the full documentation. Loopback is always
# permitted (anti-lockout) and ACME renewal is exempt by construction.
allowed_client_networks = []
# Require users to provide a justification before connecting to an asset.
# When true, a modal prompts for a reason that is stored in the session record.
# Set to false to allow direct connections without justification.
require_justification = true

[security.argon2]
memory_size_kb = 65536
iterations = 3
parallelism = 1

[logging]
level = "info"
format = "text"

[assets]
# When false, at most one asset group per asset is enforced by the app.
# If the database still has assets in multiple groups, a WARN is logged at startup.
allow_multiple_groups_per_asset = true

[api]
# Enable or disable the M2M API endpoints (/api/v1/*)
# When disabled, only web routes are available
enabled = true
# API route prefix
prefix = "/api/v1"

[websocket]
# Maximum concurrent WebSocket connections per user.
# Prevents resource exhaustion from a single user opening too many tabs.
# Each browser tab opens multiple WS (dashboard, notifications, terminal, etc.)
# so 30 comfortably supports ~10 simultaneous SSH tabs.
max_connections_per_user = 30

# ==============================================================================
# RDP CONFIGURATION
# ==============================================================================

[rdp]
# H.264 video encoder bitrate in bits per second.
# Higher values improve text clarity and image quality but use more bandwidth.
# Default: 5 Mbps (suitable for LAN / low-latency environments).
# Recommended range: 2_000_000 (low quality) to 30_000_000 (high quality).
video_bitrate_bps = 5_000_000

# ==============================================================================
# EMAIL NOTIFICATIONS (Issue #10)
# ==============================================================================
#
# vauban-mailer (sealed leaf) drains email_outbox and sends mail through the
# supervisor-brokered TCP socket. vauban-web only INSERTs rows + renders bodies.
# The supervisor enforces an exact (host, port) whitelist before connect().
#
# Disabled by default. Enable in production via vauban.conf or a
# secrets-injecting mechanism. SMTP password MUST come from the
# environment variable VAUBAN_SMTP_PASSWORD (cleared from /proc/PID/environ
# right after read), never from TOML.

[mailer]
enabled = false
from_address = ""                       # e.g. "vauban@example.com"
from_name = "Vauban PAM"
reply_to = ""
base_url = "https://localhost:8443"     # used to build links in emails
smtp_host = ""                          # e.g. "smtp.example.com"
smtp_port = 587
smtp_encryption = "starttls"            # "starttls" | "tls" | "plaintext" (dev only)
smtp_username = ""                      # override via VAUBAN_SMTP_USERNAME
smtp_password = ""                      # override via VAUBAN_SMTP_PASSWORD (preferred)
helo_name = ""                          # falls back to "vauban" if empty
poll_interval_secs = 10
batch_size = 16
max_attempts = 5
smtp_timeout_secs = 30
broker_timeout_secs = 30

# ==============================================================================
# SESSION RECORDING
# ==============================================================================

[recording]
enabled = true
storage_path = "recordings"
recording_daily_cron_timezone = "Europe/Brussels"

# Per-protocol switches; require enabled = true to take effect.
rdp = true
ssh = true
iacs = true

# Hydrator
hydration_daily_cron_hour = 4
hydration_enqueue_delay_secs = 5
hydration_missing_meta_grace_secs = 300

# Retention reaper
retention_daily_cron_hour = 5
retention_enabled = true
retention_days = 365
retention_max_size_gib = 0       # 0 = unlimited
retention_batch_size = 50

# ==============================================================================
# TAMPER-EVIDENT AUDIT LOG (WORM)
# ==============================================================================
#
# Separate tree from [recording] on purpose: the WORM log is append-only and
# never deleted, while session recordings are large media subject to the
# retention reaper. Keeping them apart lets operators apply distinct ownership,
# backup, and immutability policies (e.g. an append-only / WORM mount on
# `log_path`). Production overrides `log_path` with an absolute path.

[audit]
# Root of the append-only WORM segments (<log_path>/YYYY/MM/audit-<n>.jsonl).
log_path = "audit"
# Sealed Ed25519 signing key (provisioned via `vauban-vault seal-audit-key`).
# Defaults to "<log_path>/signing_key.sealed"; the vault provisioning command
# honours the matching VAUBAN_AUDIT_SIGNING_KEY_PATH / VAUBAN_AUDIT_LOG_PATH env.
# signing_key_path = "audit/signing_key.sealed"

# ==============================================================================
# PRODUCT / BRANDING (white-label)
# ==============================================================================
#
# `[product.brand].name` is the wordmark rendered in the top-left of every
# sidebar-bearing page. Default is "VAUBAN" (no white-label). A small
# catalogue of recognised values swaps the wordmark for an embedded SVG:
#
#   - "BAŞKESEN" -> Turkish flag SVG (red field, white crescent + star).
#
# Any other value falls back to the default "VAUBAN" wordmark, so
# operators can experiment without breaking the sidebar visually.

[product.brand]
name = "VAUBAN"

# ==============================================================================
# IACS / INDUSTRIAL
# ==============================================================================
#
# Master switch for the entire industrial surface (UI, sshd tunnel, EWS
# onboarding, future protocols). Default `false` (opt-in). Environment-
# specific files (development.toml, vauban.conf, testing.toml) may override.

[industrial]
enabled = false
max_ews_per_user = 0      # 0 = no cap; otherwise a per-user EWS quota

[industrial.iacs_tunnel]
bind_addr = "0.0.0.0:22322"
advertise_hostname = "localhost"
host_key_path = "vauban-proxy-iacs/certs/iacs_tunnel_host_ed25519"
max_concurrent_per_user = 4
max_concurrent_per_ews = 2
max_concurrent_channels_per_session = 16
waiting_client_ttl_seconds = 300
revocation_poll_interval_seconds = 2
allow_loopback_targets = false

# ==============================================================================
# AUTHENTICATION BACKENDS (web view)
# ==============================================================================
#
# The web process never opens an LDAP connection itself; it forwards bind
# requests to vauban-auth. It only needs to know whether LDAP is
# enabled and where it sits in the auth precedence for UNKNOWN usernames.
# The directory URL, CA and DN template live in the supervisor config
# (config/vauban.conf, [auth.ldaps]).
#
# Existing users are always routed by their own stored `auth_source`; the
# `order` list only governs just-in-time provisioning of unknown usernames.

[auth.ldaps]
enabled = false
order = ["local"]

# ------------------------------------------------------------------------------
# Kerberos KDC brokering (RDP "kerberos_restricted_admin" auth mode)
# ------------------------------------------------------------------------------
#
# When enabled, the supervisor relays the sandboxed RDP proxy's Kerberos KDC
# exchanges (AS-REQ / TGS-REQ) to the configured domain controller over TCP 88
# (the proxy cannot open the socket itself once sealed). The supervisor
# connects ONLY to the endpoint below, ignoring any host embedded in the
# relayed request (SSRF-safe). Realm is uppercase (e.g. EXAMPLE.COM).
[auth.kerberos]
enabled = false
# realm = "EXAMPLE.COM"
# kdc_host = "dc1.example.com"
# kdc_port = 88
# timeout_secs = 5
