# VAUBAN - Development configuration
# Overrides default.toml values for the development environment.

environment = "development"
secret_key = "CHANGE-ME-IN-PRODUCTION-32-CHARS!"

# ==============================================================================
# SUPERVISOR OVERRIDES
# ==============================================================================

# Development: binaries in target/debug
bin_path = "./target/debug"

[product.brand]
name = "VAUBAN"

[supervisor]
privsep = false

# ==============================================================================
# WEB OVERRIDES (vauban-web)
# ==============================================================================

[logging]
level = "debug"
format = "text"

[cache]
enabled = false

# Development TLS certificates (self-signed)
# Generate with: ./vauban-web/scripts/generate-dev-certs.sh
[server.tls]
cert_path = "vauban-web/certs/dev-server.crt"
key_path = "vauban-web/certs/dev-server.key"

# Disable justification modal in development for faster iteration
[security]
require_justification = false

# ACME disabled in development (self-signed certs used)
[server.tls.acme]
enabled = false

# ==============================================================================
# IACS / INDUSTRIAL
# ==============================================================================
#
# Engineering Workstation (EWS) onboarding -- preliminary scaffolding for
# future IACS asset support. The module exposes the "IACS" sidebar entry
# (Administration zone), the "Onboard EWS" button on /assets, and the
# /iacs/* routes (user-zone form + admin-zone CRUD).
#
# When `enabled = false`, the entire surface is killed: routes return 404,
# sidebar entries are hidden, and `PermissionContext::iacs_*` is forced to
# false even if the Casbin policy grants the action. Existing rows in
# `ews_*` tables are kept; re-enabling exposes them again.
[industrial]
enabled = true            # set to false to fully hide the IACS surface
max_ews_per_user = 0      # 0 = no cap; otherwise a per-user EWS quota

# IACS tunnel sub-module: in-process sshd (russh) inside `vauban-web`.
# Onboarded EWS connect to `bind_addr` with their VAUBAN id_VAUBAN
# private key, the SSH username is the one-shot session UUID, and the
# server only accepts a single `direct-tcpip` channel forwarded to
# `target_addr`. All other SSH channels (shell, exec, subsystem,
# tcpip-forward) are rejected.
#
# Boot precondition: industrial.enabled = true AND iacs_tunnel.enabled
# = true. Either of those false, the sshd never binds.
#
# Production stores the ed25519 host key under /var/lib/vauban/. The
# development binary runs as the dev user without write access there, so
# host_key_path points at vauban-web/certs/ (gitignored, persists across
# cargo clean).
[industrial.iacs_tunnel]
enabled = true
bind_addr = "0.0.0.0:22322"
advertise_hostname = "localhost"
target_addr = "127.0.0.1:4321"
host_key_path = "vauban-web/certs/iacs_tunnel_host_ed25519"
max_concurrent_per_user = 4
max_concurrent_per_ews = 2
waiting_client_ttl_seconds = 300
revocation_poll_interval_seconds = 2
