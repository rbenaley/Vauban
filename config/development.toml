# VCP - Development overrides (layered on default.toml).

environment = "development"

[server]
host = "127.0.0.1"
port = 8443
# Replace with the public portal origin(s). Format: https://host[:port]
public_origins = ["https://127.0.0.1:8443", "https://localhost:8443"]

[server.tls]
cert_path = "certs/dev-server.crt"
key_path = "certs/dev-server.key"
# ca_chain_path = "certs/chain.crt"

[server.tls.acme]
enabled = false
email = "dev@localhost"
domains = ["localhost"]
renew_before_hours = 24
account_key_path = "certs/acme-account.json"
staging = true
directory_url = "https://acme-v02.api.letsencrypt.org/directory"
staging_directory_url = "https://acme-staging-v02.api.letsencrypt.org/directory"

[database]
url = "postgresql://localhost/vcp"

[access]
model_path = "config/access/model.conf"
policy_path = "config/access/default_policy.csv"

[session]
dangerous_disable_origin_verification = true
