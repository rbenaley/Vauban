# Vauban LDAPS mapping -- operator file (0644 root:wheel)
# Path: /usr/local/etc/vauban/access/ldaps_mapping.conf
# Repo: config/access/ldaps_mapping.conf
#
# Two planes, one file:
#   resolve  -- how vauban-auth collects directory keys (LDAP I/O)
#   static / match -- how vauban-web maps those keys to existing User Groups
#
# Uncomment ONE resolve block (or several: keys are unioned, max 3 resolve
# lines). Then uncomment the static / match lines that match your DNs.
# {username} is illegal here. {name} is a capture, never a filter.
# A mapping-file key that contains \ refuses boot.
#
# Coverage catalogue (product / group schema / DSL):
# docs/technical/Vauban_LDAPS_Auth_Architecture_EN(1.1).md Appendix B.
#
# Phase-1 allowlist:
#   user-attr:  memberOf | isMemberOf | isDirectMemberOf
#   group-attr: member | uniqueMember
#   key:        dn (default) | mail
#   compare:    dn only in Phase 1 (uid = later extension, POSIX / Apple OD)
#
# This shipped default is comments only. When [auth.ldaps]
# aggregation_enabled = true, a file with no resolve line refuses boot
# (fail-closed). Uncomment the block that matches the directory, then
# restart the supervisor. No hot-reload.

# =============================================================================
# 1. Active Directory / AD LDS / Samba AD / Azure AD DS / AWS Managed AD
#    Schema: memberOf on the user (DN). Direct groups only.
#    memberOf;range= (>~1500 values) is incomplete (case C), not empty.
#    primaryGroupID (Domain Users) is not in memberOf -- unsupported Phase 1.
# =============================================================================
# resolve  user-attr  memberOf
#
# static   CN=Domain Admins,CN=Users,DC=netris,DC=local          Administrators
# match    CN={name},OU=UserGroup,OU=Vauban,DC=netris,DC=local   {name}

# =============================================================================
# 2. Authentik LDAP Outpost
#    Schema: memberOf on the user AND member on the group (DN).
#    Prefer user-attr when the outpost ACL exposes memberOf.
#    If memberOf is empty after bind (ACL), use the group-attr line instead
#    -- or uncomment BOTH (union, two searches).
# =============================================================================
# resolve  user-attr  memberOf
# resolve  group-attr  member  base  OU=groups,DC=netris,DC=local
#
# match    CN={name},OU=groups,DC=netris,DC=local   {name}

# =============================================================================
# 3. FreeIPA / 389 Directory Server (memberOf plugin)
#    Schema: memberOf on the user, member on the group (RFC 2307bis).
#    Nested / memberOfIndirect is Phase 2.
# =============================================================================
# resolve  user-attr  memberOf
#
# static   CN=admins,CN=groups,CN=accounts,DC=netris,DC=local    Administrators
# match    CN={name},CN=groups,CN=accounts,DC=netris,DC=local    {name}

# =============================================================================
# 4. OpenLDAP with slapo-memberof (or 389 memberOf overlay)
#    Schema: memberOf on the user (DN). Same resolve as AD, different DNs.
# =============================================================================
# resolve  user-attr  memberOf
#
# match    CN={name},OU=groups,DC=netris,DC=local   {name}

# =============================================================================
# 5. OpenLDAP / Apache Directory Server WITHOUT memberOf overlay
#    Schema: member (groupOfNames) or uniqueMember (groupOfUniqueNames).
#    Uncomment exactly one group-attr line.
# =============================================================================
# resolve  group-attr  member         base  OU=groups,DC=netris,DC=local
# resolve  group-attr  uniqueMember   base  OU=groups,DC=netris,DC=local
#
# match    CN={name},OU=groups,DC=netris,DC=local   {name}

# =============================================================================
# 6. Google Secure LDAP (Cloud Identity / Workspace)
#    Schema: memberOf + member + memberUid + group mail.
#    memberOf is often empty unless the LDAP client may "Read group
#    information". Prefer group-attr; add user-attr if the ACL allows it.
#    Client-certificate TLS is vauban.conf / vault, not this file.
# =============================================================================
# resolve  group-attr  member  base  DC=netris,DC=eu  key mail
# resolve  user-attr   memberOf
#
# static   vauban-admins@netris.eu   Administrators
# match    {name}@netris.eu          {name}

# =============================================================================
# 7. JumpCloud Cloud LDAP
#    Schema: memberof on the user, member on groupOfNames.
# =============================================================================
# resolve  user-attr  memberOf
#
# match    CN={name},OU=Users,O=YOUR_ORG_ID,DC=jumpcloud,DC=com   {name}

# =============================================================================
# 8. Okta LDAP Interface
#    Schema: uniqueMember on groupOfUniqueNames; memberOf on the user
#    (not indexed). User bind may be forbidden to read groups -- that is
#    a Phase 2 read identity, not a mapping-file problem.
# =============================================================================
# resolve  user-attr   memberOf
# resolve  group-attr  uniqueMember  base  OU=groups,DC=YOUR_SUBDOMAIN,DC=okta,DC=com
#
# match    CN={name},OU=groups,DC=YOUR_SUBDOMAIN,DC=okta,DC=com   {name}

# =============================================================================
# 9. Kanidm LDAP interface
#    Schema: memberof on the user. Group DNs are usually spn=name@realm
#    (no CN=). Match the whole DN; do not copy an AD CN= template.
# =============================================================================
# resolve  user-attr  memberOf
#
# static   spn=idm_admins@idm.netris.local,DC=idm,DC=netris,DC=local   Administrators
# match    spn={name}@idm.netris.local,DC=idm,DC=netris,DC=local       {name}

# =============================================================================
# 10. LLDAP
#     Schema: memberOf on the user. Groups live under ou=groups.
# =============================================================================
# resolve  user-attr  memberOf
#
# match    CN={name},OU=groups,DC=example,DC=com   {name}

# =============================================================================
# 11. PingDirectory / PingDS
#     Schema: virtual isMemberOf (all groups, often nested) or
#     isDirectMemberOf (direct only -- closer to Phase 1). Request the
#     operational attribute; it may be hidden by default.
# =============================================================================
# resolve  user-attr  isDirectMemberOf
# resolve  user-attr  isMemberOf
#
# match    CN={name},OU=groups,DC=netris,DC=local   {name}

# =============================================================================
# 12. Univention UCS
#     Schema: OpenLDAP + memberOf. Same resolve as block 4; UCS DNs differ.
# =============================================================================
# resolve  user-attr  memberOf
#
# match    CN={name},CN=groups,DC=netris,DC=local   {name}

# =============================================================================
# 13. NetIQ / Micro Focus eDirectory
#     Schema: groupMembership on the user (memberOf equivalent).
#     Attribute is not on the Phase-1 allowlist -- add it when a customer
#     needs it (same grammar, no parser change). Do not uncomment yet.
# =============================================================================
# resolve  user-attr  groupMembership
#
# match    CN={name},OU=groups,O=netris   {name}

# =============================================================================
# 14. IBM Security Verify Directory
#     Schema: ibm-allGroups (often transitive). Same note as eDirectory:
#     allowlist extension, same grammar. Do not uncomment yet.
# =============================================================================
# resolve  user-attr  ibm-allGroups
#
# match    CN={name},OU=groups,DC=netris,DC=local   {name}

# =============================================================================
# 15. Oracle DSEE / 389 managed roles
#     Schema: nsRole / nsRoleDN (roles, not groups -- same user-attr shape).
#     Allowlist extension. Do not uncomment yet.
# =============================================================================
# resolve  user-attr  nsRole
#
# match    CN={name},OU=roles,DC=netris,DC=local   {name}

# =============================================================================
# 16. POSIX RFC 2307 / Apple Open Directory / some NAS (Synology, TrueNAS)
#     Schema: memberUid holds a login, not a DN.
#     Requires compare uid (planned grammar, not Phase 1). Do not uncomment.
# =============================================================================
# resolve  group-attr  memberUid  base  OU=groups,DC=netris,DC=local  compare uid
#
# match    CN={name},OU=groups,DC=netris,DC=local   {name}

# =============================================================================
# Unsupported in this file (not a membership list -- needs another ADR)
#   - AD primaryGroupID / Domain Users
#   - AD LDAP_MATCHING_RULE_IN_CHAIN (nested)
#   - Dynamic groups (memberURL / groupOfURLs)
# =============================================================================
