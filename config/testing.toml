# VCP - Testing overrides (layered on default.toml; no local.toml).

environment = "testing"

[server]
host = "127.0.0.1"
port = 3001
public_origins = ["https://127.0.0.1:3001"]
access_log_path = "logs/vcp-access.log"

[server.tls]
cert_path = "certs/test-server.crt"
key_path = "certs/test-server.key"

[server.tls.acme]
enabled = false

[database]
# Local-only test credentials (same pattern as Vauban vauban_test).
url = "postgresql://vcp_test:vcp_test@localhost/vcp_test"

# Mailpit (or local SMTP catch-all) for the test suite.
[mail]
smtp_host = "localhost"
smtp_port = 1025
smtp_encryption = "plaintext"
smtp_username = ""
smtp_password = ""

[magiclinks]
from_address = "no-reply@vauban.sh"
from_name = "Vauban Customer Portal"
reply_to = ""
vcp_admin = "support@vauban.sh"
token_ttl_secs = 300
token_retention_days = 0
purge_interval_minutes = 60

# High ceiling so normal tests do not trip lockout; E2E rate-limit uses a custom limiter.
[login]
max_attempts = 1000
window_secs = 300
lockout_secs = 1

[org]
max_accounts_per_org = 5
max_lts_subscriptions = 99

[storage]
blob_path = "target/vcp-storage-test"
ipc = "inline"
