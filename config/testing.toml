# VAUBAN - Testing configuration
# Overrides default.toml values for tests.

environment = "testing"
secret_key = "test-secret-key-for-integration-tests!"

# ==============================================================================
# SUPERVISOR OVERRIDES
# ==============================================================================

# Testing: binaries in target/debug
bin_path = "./target/debug"

[product.brand]
name = "VAUBAN"

[supervisor]
privsep = false

# ==============================================================================
# WEB OVERRIDES (vauban-web)
# ==============================================================================

[database]
url = "postgresql://vauban_test:vauban_test@localhost/vauban_test"
# Bumped from 30 to 95 to keep the pool ahead of `cargo test`'s parallel
# defaults. Each test typically holds a fixture connection AND triggers an
# HTTP request whose middleware stack (auth + CSRF + audit + handler) acquires
# 2-4 additional connections. With ~20 tests in flight on a multi-core box the
# previous ceiling led to spurious "connection closed" / "/login" flake.
max_connections = 95

[logging]
level = "warn"
format = "text"

[cache]
enabled = false

# Match legacy integration tests: single membership enforced at app level.
[assets]
allow_multiple_groups_per_asset = false

# Testing TLS certificates (use dev certs for tests)
[server.tls]
cert_path = "vauban-web/certs/dev-server.crt"
key_path = "vauban-web/certs/dev-server.key"

# ACME disabled in tests
[server.tls.acme]
enabled = false

# Disable justification requirement by default in tests so pre-existing
# connect tests are not broken. SEC-03 specific tests override this.
[security]
require_justification = false

# Lightweight Argon2 parameters for faster tests
[security.argon2]
memory_size_kb = 1024
iterations = 1
parallelism = 1

# IACS sshd disabled in the test profile: the integration tests that
# need a sshd build their own (`spawn_iacs_tunnel_server` on
# `127.0.0.1:0` with a per-test temp host key path), and leaving the
# global instance disabled prevents two parallel test runs from
# fighting over the same host key file.
[industrial.iacs_tunnel]
enabled = false
host_key_path = "vauban-web/certs/iacs_tunnel_host_ed25519.test"
