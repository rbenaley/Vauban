# VCP storage helper — production configuration (self-contained).
#
# Deploy as /usr/local/etc/vcp/vcp-store.conf (same directory as vcp.conf is
# fine; jails may mount only this file into the helper jail).
# Start vcp-store before vcp. Portal vcp.conf [storage] needs ipc + socket_path
# and the SAME webauthn_origin as this file (RP ID is derived; /admin/key uses
# the portal copy).
#
# Production OS users (fixed UIDs):
#   vcp          = 800  (portal)
#   vcp-storage  = 801  (helper process / blob owner)

# Blob root + SQLite digest SoT (meta.sqlite). Owned by vcp-storage, mode 0700.
blob_path = "/var/db/vcp/storage"

# Named SEQPACKET listen path (helper jail view of the socket).
listen = "/var/run/vcp/store.sock"

# Portal process UID (vcp = 800) — reject other peers via getpeereid / SO_PEERCRED.
expected_peer_uid = 800

# Abuse guards (enforced by the helper).
max_artifact_bytes = 2147483648
max_image_bytes = 10485760
allowed_image_types = ["png", "jpeg", "webp"]
max_concurrent_uploads = 4
max_images_per_org = 1000
upload_ttl_secs = 3600

# WebAuthn / CTAP2 (Relying Party inside the helper). Architecture 1.2.
# RP ID is derived from the origin hostname (not a separate TOML key).
# Keep in sync with vcp.conf [storage].webauthn_origin and the browser URL.
webauthn_origin = "https://access.vauban.sh"
webauthn_required = true
webauthn_user_verification = "required"
webauthn_challenge_ttl_secs = 300
webauthn_pending_ttl_hours = 24
webauthn_strict_sign_count = false