# cargo-deny: `just deny` runs `check advisories`.
# Existing, accepted findings are ignored so the gate fails only on NEW
# advisories. Do not add an ignore without a dated reason.

[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"
ignore = [
    # IPC wire format; no maintained bincode 2.x successor in-tree yet.
    "RUSTSEC-2025-0141",
    # Mysql-only diesel-async padding UB; Vauban uses Postgres.
    "RUSTSEC-2026-0138",
    # Marvin / rsa via russh; no patched rsa yet.
    "RUSTSEC-2023-0071",
    # rustls-pemfile archived; migrate to rustls-pki-types later.
    "RUSTSEC-2025-0134",
    # smartstring via rhai/casbin; archived upstream.
    "RUSTSEC-2026-0249",
    # atomic-polyfill via ironrdp/sspi (vauban-proxy-rdp lockfile).
    "RUSTSEC-2023-0089",
    # 2026-11-10: pin-utils archived (RUSTSEC-2026-0441). async-dnssd 0.5
    # still pins it; sspi 0.23 and ironrdp 0.17 have not moved off that
    # crate. vauban-proxy-rdp lockfile only. No patched release.
    "RUSTSEC-2026-0441",
    # 2026-10-21: basic-toml is archived. askama 0.15 still parses
    # vauban-web/askama.toml with it. Askama's master uses toml, but
    # no release does yet, and 0.16.1 still depends on basic-toml.
    "RUSTSEC-2026-0374",
]
