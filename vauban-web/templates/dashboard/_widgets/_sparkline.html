{# Bastion Watch sparkline -- requires `spark: Sparkline` in scope. #}
<svg class="block" width="{{ spark.width }}" height="{{ spark.height }}"
     viewBox="0 0 {{ spark.width }} {{ spark.height }}"
     role="img" aria-label="trend sparkline" focusable="false">
  <polyline fill="none" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"
            points="{{ spark.points }}" />
  <circle cx="{{ spark.last_x }}" cy="{{ spark.last_y }}" r="2"
          fill="currentColor" />
</svg>
