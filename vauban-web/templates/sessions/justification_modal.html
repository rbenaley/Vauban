<!-- Connection Justification Modal (SEC-03) - Alpine.js driven -->
<!-- Included in asset_detail.html; triggered when require_justification is true -->
<div x-show="$store.justificationModal.show"
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 z-50 overflow-y-auto"
     x-cloak>
    <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
        <!-- Backdrop -->
        <div class="fixed inset-0 bg-gray-500/75 dark:bg-gray-900/75 transition-opacity" @click="$store.justificationModal.show = false"></div>

        <!-- Modal panel -->
        <div x-show="$store.justificationModal.show"
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
             x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
             x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
             class="relative transform overflow-hidden rounded-lg bg-white dark:bg-gray-800 px-4 pb-4 pt-5 text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-lg sm:p-6">

            <div class="absolute right-0 top-0 pr-4 pt-4">
                <button type="button" @click="$store.justificationModal.show = false"
                        class="rounded-md bg-white dark:bg-gray-800 text-gray-400 hover:text-gray-500 dark:hover:text-gray-300">
                    <span class="sr-only">Close</span>
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <div class="sm:flex sm:items-start">
                <div class="mx-auto flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-full bg-vauban-100 dark:bg-vauban-900/50 sm:mx-0 sm:h-10 sm:w-10">
                    <svg class="h-6 w-6 text-vauban-600 dark:text-vauban-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>
                    </svg>
                </div>
                <div class="mt-3 text-center sm:ml-4 sm:mt-0 sm:text-left flex-1">
                    <h3 class="text-base font-semibold leading-6 text-gray-900 dark:text-white">
                        Connection Justification
                    </h3>
                    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
                        Please provide a reason for connecting to this asset. This will be recorded for audit purposes.
                    </p>

                    <form hx-post="/assets/{{ asset.uuid }}/{%- if asset.asset_type == "rdp" -%}connect-rdp{%- else -%}connect{%- endif -%}"
                          hx-swap="none"
                          class="mt-4 space-y-4"
                          x-data="csrf"
                          @htmx:after-request="if(event.detail.successful) $store.justificationModal.show = false">
                        <input type="hidden" name="csrf_token" x-model="token" />

                        <div>
                            <label for="justification" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                                Justification <span class="text-red-500">*</span>
                            </label>
                            <textarea id="justification"
                                      name="justification"
                                      rows="3"
                                      required
                                      minlength="10"
                                      maxlength="1000"
                                      placeholder="Explain why you need to connect to this asset..."
                                      class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-vauban-500 focus:ring-vauban-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white sm:text-sm"></textarea>
                            <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">
                                Minimum 10 characters.
                            </p>
                        </div>

                        <div class="mt-5 sm:mt-4 sm:flex sm:flex-row-reverse gap-3">
                            <button type="submit"
                                    class="inline-flex w-full justify-center rounded-md bg-vauban-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-vauban-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-vauban-600 sm:w-auto [&.htmx-request]:opacity-50 [&.htmx-request]:cursor-wait">
                                <span class="[.htmx-request_&]:hidden">Connect</span>
                                <span class="hidden [.htmx-request_&]:inline">Connecting...</span>
                            </button>
                            <button type="button"
                                    @click="$store.justificationModal.show = false"
                                    class="mt-3 inline-flex w-full justify-center rounded-md bg-white dark:bg-gray-700 px-3 py-2 text-sm font-semibold text-gray-900 dark:text-white shadow-sm ring-1 ring-inset ring-gray-300 dark:ring-gray-600 hover:bg-gray-50 dark:hover:bg-gray-600 sm:mt-0 sm:w-auto">
                                Cancel
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
