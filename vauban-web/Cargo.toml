[package]
name = "vauban-web"
description = "VAUBAN - Security Bastion - Web Interface and API (Rust)"
readme = "README.md"
default-run = "vauban-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Shared IPC library
shared = { workspace = true, features = ["tasks", "session-token", "access-guard", "iacs-protocol", "ssh-keygen", "client-acl"] }

# Shared Diesel schema
vauban-db.workspace = true
vauban-web-evidence.workspace = true

# Web framework
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "timeout", "trace", "compression-gzip", "compression-br"] }

# Database
diesel = { version = "2.3", features = ["postgres", "uuid", "chrono", "serde_json", "network-address", "64-column-tables"] }
diesel-async = { version = "0.7", features = ["postgres", "deadpool"] }
deadpool = { version = "0.12", features = ["managed"] }

# Templates
askama = { version = "0.15", features = ["serde_json"] }

# Authentication
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
argon2 = "0.5"
totp-rs = { version = "5.6", features = ["qr", "gen_secret"] }
secrecy = { version = "0.10", features = ["serde"] }
zeroize = { version = "1.8", features = ["derive"] }

# OAuth2 / OpenID Connect
oauth2 = "5"
openidconnect = "4"

# Sessions
tower-sessions = "0.14"

# Validation
validator = { version = "0.20", features = ["derive"] }

# Cryptography (Post-Quantum)
pqcrypto-mlkem = "0.1"
pqcrypto-mldsa = "0.1"
pqcrypto-traits = "0.3"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
aes-gcm = "0.10"
sha1 = "0.10"
sha3 = "0.10"
blake3 = "1.5"
hkdf = "0.12"
subtle = "2.5"

# Logging
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Serialization
serde.workspace = true
serde_json = "1.0"

# Utilities
uuid = { version = "1.11", features = ["v4", "v5", "serde"] }
ipnetwork = "0.21"
chrono = { version = "0.4", features = ["serde"] }
# IANA timezone database for browser-side date/time localization
# (see middleware/browser_tz.rs and utils/datetime_format.rs). DB /
# logs / IPC remain UTC; only the rendered UI uses chrono-tz.
chrono-tz = "0.10"
async-trait = "0.1"
time = "0.3"
bcrypt = "0.18"
rand = "0.8"
hex = "0.4"
url = "2.5"
base32 = "0.5"
base64 = "0.22"
sha2 = "0.10"   # SHA-256 fingerprint for the IACS / EWS SSH public-key flow
libc.workspace = true
nix.workspace = true

# Security
dashmap = "6"       # Concurrent HashMap for in-memory rate limiting
ammonia = "4"       # HTML sanitization
regex = "1"         # Regular expressions for input validation

# Configuration
config = "0.15"
dotenvy = "0.15"

# HTTP client
reqwest = { version = "0.13", features = ["json", "rustls"] }

# WebSocket & Cookies
axum-extra = { version = "0.12", features = ["cookie", "typed-header"] }
futures-util = { version = "0.3", features = ["io"] }

# TLS (HTTPS only, TLS 1.3)
axum-server = { version = "0.8", features = ["tls-rustls"] }
rustls = "0.23"
rustls-pki-types = "1"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
# Used by the embedded SMTP client (Issue #10) to upgrade the
# supervisor-brokered TCP socket via STARTTLS. Pinned to 0.26 to match
# what `vauban-proxy-rdp` already audits.
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
webpki-roots = "1"

# Streaming ZIP for the RDP recording bundle download. `tokio` feature
# enables a tokio-friendly async writer; we use the `Stored` compression
# mode (no CPU work) since the segment files are already H.264 elementary
# streams in fMP4.
async_zip = { version = "0.0.17", default-features = false, features = ["tokio"] }

# IACS Inspect Capture decompression for handler SCM_RIGHTS fetch.
# Packet parse/dissection lives in `vauban-web-evidence` (etherparse).
flate2 = "1"

[dev-dependencies]
vauban-access = { path = "../vauban-access" }
# Round-trip tests for Inspect Capture (vauban-web-evidence analyzer)
# synthesise real PCAP fixtures via the audit-side `iacs_pcap_synth` builders so the
# parser is exercised against the exact byte layout vauban-audit writes on disk.
vauban-audit = { path = "../vauban-audit" }
casbin.workspace = true
tokio-test = "0.4"
mockall = "0.14"
axum-test = "18"
tempfile = "3"
serial_test = "3"
once_cell = "1.19"
insta = { version = "1.40", features = ["yaml"] }
tokio-tungstenite = "0.28"
serde_urlencoded = "0.7.1"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
# VAU-010: `ServiceExt::oneshot` for the in-crate CORS layer E2E tests.
tower = { version = "0.5", features = ["util"] }
# BAC hardening: property-based invariants on the require_* route-layer
# gates (fail-closed for every PermissionContext, anti-oracle paths).
proptest = "1"

[lints]
workspace = true

