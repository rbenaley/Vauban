[package]
name = "vauban-auth"
description = "Vauban - Authentication service (MFA, SSO, LDAP)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
shared.workspace = true
libc.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
serde.workspace = true
argon2 = "0.5"
rand = "0.8"
# LDAPS: synchronous TLS for the directory bind. We deliberately
# avoid tokio and ldap3 -- the codec is a hand-rolled minimal BER simple-bind
# and rustls offers a blocking `Stream` over any Read+Write FD.
rustls = "0.23"
rustls-pemfile = "2"
rustls-pki-types = "1"

[dev-dependencies]
# In-process LDAPS test server (rcgen CA + server cert) for the E2E bind tests.
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
