# VCP Apache CLF access log (no compression). Signal the process_guard pid
# so vcp reopens the file on SIGHUP (see src/tls/access_log.rs).
/var/log/vcp-access.log	640	20	102400	*	C	/var/run/vcp/vcp.pid	1
# daemon(8) stderr captures
/var/log/vcp.log		640	20	102400	*	CN
/var/log/vcp-store.log		640	20	102400	*	C	/var/run/vcp/vcp-store.pid	1
