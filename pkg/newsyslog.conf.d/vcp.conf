# Flat /var/log layout (no compression). The owner:group field is required:
# rotation recreates the live file, and the portal (running as vcp) must be
# able to reopen it. Access log: signal the process_guard pid so vcp reopens
# on SIGHUP (see src/tls/access_log.rs).
/var/log/vcp-access.log  vcp:wheel          640  20  102400  *  C   /var/run/vcp/vcp.pid    1
/var/log/vcp.log         vcp:wheel          640  20  102400  *  CN
/var/log/vcp-store.log   vcp-storage:wheel  640  20  102400  *  C   /var/run/vcp-store.pid  1
