# Flat /var/log layout (no compression). The owner:group field is required:
# rotation recreates the live file, and the process writing it must be able
# to reopen it. Access log: SIGHUP the process_guard pid (/var/run/vcp/vcp.pid,
# note the subdirectory) so vcp reopens it (see src/tls/access_log.rs).
# Stderr captures: SIGHUP the daemon(8) supervisor pids; -H reopens -o.
# Size is kilobytes (newsyslog.conf(5)): 1048576 KiB = 1 GiB.
/var/log/vcp-access.log  vcp:wheel          640  20  1048576  *  C   /var/run/vcp/vcp.pid    1
/var/log/vcp.log         vcp:wheel          640  20  1048576  *  C   /var/run/vcp.pid        1
/var/log/vcp-store.log   vcp-storage:wheel  640  20  1048576  *  C   /var/run/vcp-store.pid  1
