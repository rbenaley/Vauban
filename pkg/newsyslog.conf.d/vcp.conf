# Flat /var/log layout (no compression). Access log: signal the
# process_guard pid so vcp reopens on SIGHUP (see src/tls/access_log.rs).
/var/log/vcp-access.log	640	20	102400	*	C	/var/run/vcp/vcp.pid	1
/var/log/vcp.log		640	20	102400	*	CN
/var/log/vcp-store.log		640	20	102400	*	C	/var/run/vcp-store.pid	1
