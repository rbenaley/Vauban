[package]
name = "vauban-e2e"
version = "0.9.48"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Full-stack tests: real supervisor + every service + a real browser. Never part of the product build."

# Excluded from the workspace: `cargo build` / `cargo test --workspace`
# never compile it and nothing here reaches a shipped binary.
# Run with `just test-full-stack`.

[lib]
path = "src/lib.rs"
test = false
doctest = false

[[test]]
name = "full_stack"
path = "tests/full_stack.rs"
harness = false

[dev-dependencies]
anyhow = "1.0.104"
base64 = "0.22"
libtest-mimic = "0.8.2"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "cookies"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
serde_json = "1.0.151"
sha2 = "0.10"
tempfile = "3.27.0"
thirtyfour = { version = "0.37", default-features = false, features = ["rustls", "manager", "component", "cdp", "reqwest"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "process", "fs", "net", "io-util", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
toml_edit = "0.25.15"
totp-rs = "5"
