[package]
name = "vauban-proxy-ssh"
description = "Vauban - SSH proxy service (russh)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Shared IPC and sandboxing utilities. The `access-guard` feature is
# mandatory: it brings in shared::access_guard, which re-verifies every
# SshSessionOpen against vauban-access (defense-in-depth RBAC re-check).
shared = { workspace = true, features = ["access-guard", "session-token"] }

# Core dependencies
libc.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true

# Async runtime (exception to minimalist philosophy for proxy services)
tokio.workspace = true
tokio-util.workspace = true

# SSH client (async, pure Rust)
# Note: russh 0.57+ includes keys module directly
russh.workspace = true
async-trait.workspace = true

# Secret management
secrecy.workspace = true

[dev-dependencies]
# Testing utilities
tokio = { workspace = true, features = ["test-util"] }
nix.workspace = true
# Host-key behavioural tests call `PrivateKey::random`, which (russh 0.61 /
# ssh-key 0.7) needs a `rand_core` 0.10 `CryptoRng`. rand_core 0.10 dropped
# `OsRng`, so we feed getrandom's `SysRng` wrapped in
# `russh::keys::ssh_key::rand_core::UnwrapErr`. Using the re-exported
# rand_core guarantees the exact same major as the call site.
getrandom = { workspace = true }
async-trait.workspace = true
proptest = "1"
blake3.workspace = true
