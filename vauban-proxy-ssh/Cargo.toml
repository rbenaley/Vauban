[package]
name = "vauban-proxy-ssh"
description = "Vauban - SSH proxy service (russh)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Shared IPC and sandboxing utilities. The `access-guard` feature is
# mandatory: it brings in shared::access_guard, which re-verifies every
# SshSessionOpen against vauban-access (defense-in-depth RBAC re-check).
shared = { workspace = true, features = ["access-guard", "session-token"] }

# Core dependencies
libc.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
serde.workspace = true

# Async runtime (exception to minimalist philosophy for proxy services)
tokio.workspace = true
tokio-util.workspace = true

# SSH client (async, pure Rust)
# Note: russh 0.57+ includes keys module directly
russh.workspace = true
async-trait.workspace = true

# Secret management
secrecy.workspace = true

[dev-dependencies]
# Testing utilities
tokio = { workspace = true, features = ["test-util"] }
nix.workspace = true
