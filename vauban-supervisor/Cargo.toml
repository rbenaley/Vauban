[package]
name = "vauban-supervisor"
description = "Vauban - Process supervisor with privilege separation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
shared.workspace = true
libc.workspace = true
nix.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json = "1.0"

# Configuration
config.workspace = true
toml = "0.9"

# Signal handling
signal-hook = "0.4"

# ACME certificate management (TLS-ALPN-01)
instant-acme = { version = "0.8", default-features = false, features = ["aws-lc-rs", "hyper-rustls"] }
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs"] }
rustls = "0.23"
tokio = { version = "1", features = ["rt", "time", "net", "io-util", "macros"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
