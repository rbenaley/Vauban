[package]
name = "vauban-supervisor"
description = "Vauban - Process supervisor with privilege separation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# `session-token` enables the cryptographic session-token gate (key
# generation at boot, env-var dissemination to children, MAC verification
# in handle_tcp_connect_request before DNS+connect). Required.
# `iacs-host-key` enables shared::iacs_host_key so the supervisor can
# load-or-generate the IACS sshd Ed25519 host key BEFORE fork and pass
# the file descriptor to vauban-proxy-iacs (the proxy is sandboxed by
# Capsicum and cannot open paths post `cap_enter` -- errno 94).
shared = { workspace = true, features = ["session-token", "iacs-host-key"] }
libc.workspace = true
nix.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json = "1.0"
zeroize.workspace = true

# CLI
clap = { version = "4", features = ["derive"] }

# Admin commands (password hashing, interactive prompts, DB access)
argon2 = "0.5"
rpassword = "7"
rand = "0.8"
diesel = { version = "2", features = ["postgres", "uuid", "serde_json"] }
vauban-db.workspace = true
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
ipnetwork = "0.21"

# Vault keyring for migrate-secrets
vauban-vault = { path = "../vauban-vault" }

# Configuration
config.workspace = true
toml = "0.9"

# Signal handling
signal-hook = "0.4"

# ACME certificate management (TLS-ALPN-01)
instant-acme = { version = "0.8", default-features = false, features = ["aws-lc-rs", "hyper-rustls"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = "0.23"
tokio = { version = "1", features = ["rt", "time", "net", "io-util", "macros"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
