[package]
name = "shared"
description = "Vauban - Shared IPC protocol, messages, and Capsicum sandboxing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
libc.workspace = true
nix.workspace = true
tracing.workspace = true
zeroize.workspace = true

# Binary serialization for IPC
bincode = { version = "2.0", features = ["serde"] }

# Optional: only pulled in by services that need the AccessGuard module
# (every protocol proxy: vauban-proxy-ssh, vauban-proxy-rdp, future
# vauban-proxy-vnc, etc.). Crates that only consume the IPC types and
# Capsicum wrappers (vauban-vault, vauban-audit, vauban-auth) MUST stay
# tokio-free, so this is gated behind the `access-guard` feature.
tokio = { workspace = true, optional = true }

# Cryptographic dependencies for the optional `session-token` module.
# Only services on the session-open hot path (vauban-access mints,
# vauban-supervisor and the proxies verify) need these; the others
# (vault, audit, auth) MUST stay free of crypto deps to keep their
# attack surface minimal.
blake3 = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
rand = { version = "0.8", optional = true }
subtle = { version = "2.5", optional = true }
uuid = { version = "1.11", features = ["v4", "serde"], optional = true }

# IACS sshd host key prep (load or generate Ed25519, persist 0600).
# Behind the `iacs-host-key` feature so tokio-free crates (vault, audit,
# auth) keep their dep tree minimal. Activated by vauban-supervisor (pre-
# binds and pre-loads the key BEFORE fork) and by vauban-proxy-iacs (parses
# the file contents read off the inherited FD BEFORE entering Capsicum).
russh = { workspace = true, optional = true }
# OS CSPRNG for Ed25519 host-key generation (see iacs_host_key.rs). Only
# needed alongside the russh-backed `iacs-host-key` feature.
getrandom = { workspace = true, optional = true }

[features]
default = []
# Enables the shared::access_guard module (defense-in-depth RBAC re-check
# against vauban-access). Requires a tokio runtime in the consuming
# binary. Activate this feature in every protocol proxy that opens
# upstream sessions on behalf of a user.
access-guard = ["dep:tokio"]
# Tiny `shared::tasks::spawn_periodic` helper (Handle-based, no
# thread-local footgun). Activate in any crate that runs ticker-driven
# background work. tokio-free crates (vault, audit, auth) MUST NOT
# enable this.
tasks = ["dep:tokio", "tokio/time", "tokio/rt"]
# Enables the shared::session_token module (cryptographic gate that
# binds every TcpConnectRequest / SessionOpen to a fresh access-signed
# decision). Activate this feature in vauban-access (mints), vauban-
# supervisor and every protocol proxy (verify). vauban-web does NOT
# need this feature -- it only transports an opaque byte vector.
session-token = ["dep:blake3", "dep:secrecy", "dep:base64", "dep:rand", "dep:subtle", "dep:uuid"]
# Enables shared::iacs_host_key (load_or_generate_host_key,
# prepare_host_key_fd, read_host_key_from_fd). Pulled in by vauban-
# supervisor (pre-loads + handsover FD) and vauban-proxy-iacs (parses
# from FD before Capsicum). Other crates do NOT need russh and stay
# slim.
iacs-host-key = ["dep:russh", "dep:getrandom"]
# Peek-based industrial wire protocol classification for the IACS
# tunnel gate in vauban-proxy-iacs. Tokio-free pure parsing.
iacs-protocol = []

# Capsicum bindings for FreeBSD
[target.'cfg(target_os = "freebsd")'.dependencies]
capsicum = "0.4"

# Linux sandbox: Landlock (path-based LSM, conceptually closest to
# Capsicum's object-capability model) + seccomp-bpf (syscall allowlist).
# Both are minimal-TCB, well-provenanced crates (landlock-lsm project /
# Firecracker). cfg-gated so vault/auth/audit pay nothing off Linux.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.5"

[dev-dependencies]
tempfile = "3"
# AccessGuard tests need real tokio + nix pipes. Keep this in dev-deps
# so a default-feature build of the consumer doesn't pay for it.
tokio = { workspace = true, features = ["test-util", "macros", "rt"] }
# session_token unit tests pull blake3, base64, secrecy, rand, subtle,
# uuid in the test binary even when the `session-token` feature is not
# the default for the workspace consumers.
blake3 = { workspace = true }
base64 = { workspace = true }
secrecy = { workspace = true }
rand = "0.8"
subtle = "2.5"
uuid = { version = "1.11", features = ["v4", "serde"] }
