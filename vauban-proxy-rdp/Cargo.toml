[package]
name = "vauban-proxy-rdp"
description = "Vauban - RDP proxy service (IronRDP)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Shared IPC and sandboxing utilities. The `access-guard` feature is
# mandatory: it brings in shared::access_guard, which re-verifies every
# RdpSessionOpen against vauban-access (defense-in-depth RBAC re-check,
# symmetric to vauban-proxy-ssh).
shared = { workspace = true, features = ["access-guard", "session-token"] }

# Core dependencies
libc.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true

# Async runtime
tokio.workspace = true

# RDP client (async, pure Rust)
# The `ironrdp` meta-crate (0.17) still resolves to ironrdp-connector 0.10,
# which pins picky =7.0.0-rc.25 and through it curve25519-dalek =5.0.0-rc.1.
# The sub-crates are depended on directly so the stack sits on a picky
# release candidate that accepts the stable dalek releases.
# Every ironrdp-* crate is taken from the fork named in the workspace
# `[patch.crates-io]`; the versions below are the ones it declares.
# `remote-guard` brings Remote Credential Guard (ironrdp-rdpear and
# sspi's `rcg` module). In the fork it does not bring sspi's DNS
# resolver: the proxy names its KDC and never asks sspi to look one up
# (kerberos_realm_preflight_invariants_test.rs, patch_pins_invariants_test.rs).
ironrdp-connector = { version = "0.12", features = ["remote-guard"] }
ironrdp-session = "0.13"
ironrdp-graphics = "0.11"
ironrdp-input = "0.9"
ironrdp-dvc = "0.10"
ironrdp-displaycontrol = "0.10"
ironrdp-pdu = "0.11"
ironrdp-core = "0.3"
ironrdp-async = "0.12"
ironrdp-tokio = "0.12"

# TLS for RDP connection upgrade
tokio-rustls = "0.26"
x509-cert = { version = "0.2", default-features = false, features = ["std"] }

# VAU-001: SPKI pinning of the target RDP server certificate. `sha2`
# hashes the full SubjectPublicKeyInfo DER, `base64` encodes the SPKI /
# fingerprint for storage + display (mirrors the SSH host-key pinning).
sha2 = "0.10"
base64.workspace = true


# Image encoding for bitmap streaming to browser (PNG fallback)
image = { version = "0.25", default-features = false, features = ["png"] }

# H.264 video encoding for real-time streaming
openh264 = "0.9"

# Secret management
secrecy.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
# Invariant-based (property) tests on the RDP input pipeline: release_all
# always clears the key/button state, lock synchronization is minimal, and
# input translation never panics on arbitrary events.
proptest = "1"
nix.workspace = true
# VAU-001: generate a self-signed leaf cert for the in-process TLS server
# used by the behavioral pinning tests (match / mismatch / fetch).
rcgen = "0.13"
# Already in the tree via sspi; needed to construct sspi NetworkRequest
# values in the NTLM-only posture test (Kerberos refused).
url = "2"
# In-process Kerberos test harness (`src/test_support`): an in-memory KDC
# ported from the test suite of `sspi`, driving the production CredSSP
# sequence against `sspi`'s own CredSSP server. All four are already in
# the tree through `sspi`, at these versions.
picky-krb = "0.13"
picky-asn1 = { version = "0.10", features = ["time_conversion"] }
picky-asn1-der = "0.5"
time = "0.3"
rand = "0.8"
