[package]
name = "vauban-proxy-rdp"
description = "Vauban - RDP proxy service (IronRDP)"
version = "0.9.25"
edition = "2024"
rust-version = "1.89"
authors = ["Richard Ben Aleya"]
license = "BSD-2-Clause"

# This crate is excluded from the main workspace due to irreconcilable
# pre-release dependency conflicts between IronRDP (picky/sspi crypto stack)
# and russh (RustCrypto stack). It has its own Cargo.lock.

[lints.clippy]
unwrap_used    = "deny"
expect_used    = "deny"
panic          = "deny"
todo           = "deny"
dbg_macro      = "deny"
unimplemented  = "deny"
print_stdout   = "deny"
print_stderr   = "deny"

[dependencies]
# Shared IPC and sandboxing utilities. The `access-guard` feature is
# mandatory: it brings in shared::access_guard, which re-verifies every
# RdpSessionOpen against vauban-access (defense-in-depth RBAC re-check,
# symmetric to vauban-proxy-ssh).
shared = { path = "../shared", features = ["access-guard", "session-token"] }

# Core dependencies
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }

# RDP client (async, pure Rust)
ironrdp = { version = "0.17", features = ["connector", "session", "graphics", "input", "dvc", "displaycontrol"] }
ironrdp-tokio = "0.10"
ironrdp-tls = { version = "0.2", features = ["rustls"] }

# TLS for RDP connection upgrade
tokio-rustls = "0.26"
x509-cert = { version = "0.2", default-features = false, features = ["std"] }

# VAU-001: SPKI pinning of the target RDP server certificate. `sha2`
# hashes the full SubjectPublicKeyInfo DER, `base64` encodes the SPKI /
# fingerprint for storage + display (mirrors the SSH host-key pinning).
sha2 = "0.10"
base64 = "0.22"


# Image encoding for bitmap streaming to browser (PNG fallback)
image = { version = "0.25", default-features = false, features = ["png"] }

# H.264 video encoding for real-time streaming
openh264 = "0.9"

# Secret management
secrecy = { version = "0.10", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
# Invariant-based (property) tests on the RDP input pipeline: release_all
# always clears the key/button state, lock synchronization is minimal, and
# input translation never panics on arbitrary events.
proptest = "1"
nix = { version = "0.31", features = ["process", "signal", "poll", "fs", "user", "socket", "uio", "term"] }
# VAU-001: generate a self-signed leaf cert for the in-process TLS server
# used by the behavioral pinning tests (match / mismatch / fetch).
rcgen = "0.13"
# Already in the tree via sspi; needed to construct sspi NetworkRequest
# values in the NTLM-only posture test (Kerberos refused).
url = "2"

# AVX2 support: upstream openh264-sys2 build.rs does not pass -DHAVE_AVX2
# to NASM or the C++ compiler, unlike Cisco's official meson.build.
# Use our fork with AVX2 optimizations for SAD and Intra Prediction.
[patch.crates-io]
openh264-sys2 = { git = "https://github.com/rbenaley/openh264-rs-avx2" }

[profile.release]
opt-level = 3
lto = true
debug = false
strip = true
